      rels.forEach((rel,ri)=>{const t=rel.tags||{};const name=t.name_zh||t['name:zh']||t.name||t.ref||`线路 ${ri+1}`;const key=String(rel.id);const color=t.colour||t.color||colors[ri%colors.length];const item=lineMap.get(key)||{id:key,name,ref:t.ref||'',color,members:[]};item.members.push(...(rel.members||[]));lineMap.set(key,item);(rel.members||[]).filter(m=>m.type==='node'&&(m.role==='stop'||m.role==='station'||m.role==='')).forEach(m=>{const n=byId.get(m.ref);if(n&&n.lat&&n.lon){const stationName=(n.tags||{}).name_zh||(n.tags||{})['name:zh']||(n.tags||{}).name||'未命名站点',norm=stationName.replace(/[·・\s（）()\-—]/g,'').toLowerCase(),group=stationMap.get(norm)||[];let s=group.find(x=>Math.hypot((x.lat-n.lat)*111000,(x.lon-n.lon)*96000)<120);if(!s){s={id:`${norm}:${group.length}`,lat:n.lat,lon:n.lon,name:stationName,lines:new Set()};group.push(s);stationMap.set(norm,group)}s.lines.add(name)}})});
      lines=[...lineMap.values()].sort((a,b)=>a.name.localeCompare(b.name,'zh'));stations=[...stationMap.values()].flat();
      const nodeCoords=new Map((data.elements||[]).filter(e=>e.type==='node'&&e.lat&&e.lon).map(e=>[e.id,[e.lat,e.lon]]));
      lines.forEach(line=>{const coords=line.members.filter(m=>m.type==='node').map(m=>nodeCoords.get(m.ref)).filter(Boolean);if(coords.length>1){const layer=L.layerGroup();L.polyline(coords,{color:line.color,weight:4,opacity:.9,lineCap:'round',lineJoin:'round'}).addTo(layer);lineLayers.set(line.id,layer);layer.addTo(map)}});
      stations.forEach(s=>{const marker=L.circleMarker([s.lat,s.lon],{radius:4,weight:2,color:'#1f7a83',fillColor:'#fff',fillOpacity:1}).bindPopup(`<strong>${escapeHtml(s.name)}</strong><br><span style="color:#66727c">${escapeHtml([...s.lines].join(' · ')||'地铁站')}</span><br><button type="button" class="popup-walk" data-station="${s.id}" style="margin-top:8px;padding:6px 9px;font-size:12px">查看本站预计算覆盖</button>`);marker.addTo(stationLayer);const c=L.circle([s.lat,s.lon],{radius:Number(radiusEl.value)*1000,stroke:false,fillColor:'#1f7a83',fillOpacity:Number(alphaEl.value)}).addTo(circleLayer);s.marker=marker;s.circle=c});
      setStatus('正在绘制线路和步行覆盖区域…',false,92);renderLineControls(); updateCounts();
    }
    function escapeHtml(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
    function renderLineControls(){lineList.innerHTML='';lines.forEach(line=>{const label=document.createElement('label');label.className='line-item';label.innerHTML=`<input type="checkbox" checked data-line="${line.id}"><span class="swatch" style="background:${line.color}"></span><span>${escapeHtml(line.name)}${line.ref?` (${escapeHtml(line.ref)})`:''}</span>`;label.querySelector('input').addEventListener('change',e=>{const layer=lineLayers.get(line.id);if(layer){if(e.target.checked)layer.addTo(map);else map.removeLayer(layer)}updateCounts()});lineList.appendChild(label)})}
    function updateCounts(){lineCount.textContent=`${lines.length} 条 · ${stations.length} 站`}
    function updateCircles(){const r=Number(radiusEl.value)*1000,a=Number(alphaEl.value);radiusValue.textContent=Number(radiusEl.value).toFixed(1)+' km';alphaValue.textContent=Math.round(a*100)+'%';stations.forEach(s=>s.circle?.setRadius(r).setStyle({fillOpacity:a}))}
    async function localIsochrone(lat,lon,minutes){const r=await fetch(`http://127.0.0.1:8002/isochrone?local=${Date.now()}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({locations:[{lat,lon}],costing:'pedestrian',contours:[{time:Number(minutes)}],polygons:true})});if(!r.ok)throw new Error(`本地路由服务 HTTP ${r.status}`);const data=await r.json();const feature=data.features?.find(f=>Number(f.properties?.contour)===Number(minutes))||data.features?.[0];if(!feature)throw new Error('本地路网未返回覆盖区');return feature}
    async function renderWalking(s){if(mode!=='walk'||!s)return;const run=++walkRun,minutes=Number(walkTimeEl.value);walkLayer.clearLayers();setStatus(`正在计算「${s.name}」的 ${minutes} 分钟步行覆盖…`,false,60);try{const feature=minutes===15&&walkData?.stations?.[s.id]?.feature?walkData.stations[s.id].feature:await localIsochrone(s.lat,s.lon,minutes);if(run!==walkRun)return;L.geoJSON(feature,{style:{color:'#1f7a83',weight:0,fillColor:'#1f7a83',fillOpacity:Number(alphaEl.value)}}).addTo(walkLayer);setStatus(`「${s.name}」步行覆盖已完成（${minutes} 分钟）。`)}catch(e){setStatus(`步行计算失败：${e.message}`,true)}}
    async function renderPicked(lat,lon){if(mode!=='walk')return;const run=++walkRun,minutes=Number(walkTimeEl.value);walkLayer.clearLayers();if(pickMarker)map.removeLayer(pickMarker);pickMarker=L.marker([lat,lon]).addTo(map).bindPopup(`自由选点<br><span style="color:#66727c">${minutes} 分钟步行覆盖</span>`).openPopup();setStatus(`正在计算自由选点的 ${minutes} 分钟步行覆盖…`,false,20);try{const feature=await localIsochrone(lat,lon,minutes);if(run!==walkRun)return;L.geoJSON(feature,{style:{color:'#d97706',weight:0,fillColor:'#f59e0b',fillOpacity:Number(alphaEl.value)}}).addTo(walkLayer);setStatus(`自由选点步行覆盖已完成（${minutes} 分钟）。`)}catch(e){setStatus(`自由选点计算失败：${e.message}`,true)}}
    function setMode(next){mode=next;const isWalk=next==='walk';document.getElementById('circleMode').classList.toggle('active',!isWalk);document.getElementById('walkMode').classList.toggle('active',isWalk);modeValue.textContent=isWalk?'本地步行':'直线近似';legendText.textContent=isWalk?'点击地图任意位置，按步行时间计算覆盖区':'默认 1 km 直线距离近似覆盖圈';timeControl.hidden=!isWalk;if(isWalk){circleLayer.remove();walkLayer.addTo(map);setStatus('本地步行模式已开启：点击地图任意位置即可计算覆盖区。')}else{walkLayer.clearLayers();walkLayer.remove();circleLayer.addTo(map);setStatus(`已载入 ${lines.length} 条线路、${stations.length} 个站点。数据来源：OpenStreetMap 快照（2026-09-14）。`)}}
    async function load(){clearAll();lineList.innerHTML='';lineCount.textContent='载入中…';setStatus('正在载入内置线路与站点快照…',false,5);try{const data=await loadSnapshot();parse(data);try{walkData=await fetch('/walking-isochrones.json').then(r=>r.json())}catch(e){walkData=null}setStatus(`已载入 ${lines.length} 条线路、${stations.length} 个站点。数据来源：OpenStreetMap 快照（2026-09-14）。`)}catch(e){setStatus('内置数据载入失败：'+(e?.message||e)+'。请重新打开页面。',true)}}
    map.on('click',e=>{if(mode==='walk')renderPicked(e.latlng.lat,e.latlng.lng)});map.on('popupopen',e=>{const button=e.popup.getElement()?.querySelector('.popup-walk');if(button)button.addEventListener('click',()=>{const s=stations.find(x=>x.id===button.dataset.station);if(s)renderWalking(s)})});radiusEl.addEventListener('input',updateCircles);alphaEl.addEventListener('input',updateCircles);walkTimeEl.addEventListener('input',()=>{timeValue.textContent=walkTimeEl.value+' 分钟'});document.getElementById('circleMode').addEventListener('click',()=>setMode('circle'));document.getElementById('walkMode').addEventListener('click',()=>setMode('walk'));document.getElementById('fit').addEventListener('click',()=>{if(stations.length)map.fitBounds(L.latLngBounds(stations.map(s=>[s.lat,s.lon])).pad(.08))});document.getElementById('toggle').addEventListener('click',()=>{document.getElementById('panel').classList.toggle('collapsed')});load();
  })();
  </script>
